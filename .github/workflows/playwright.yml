
name: TaskFlow QA Automation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: TypeScript, UI and API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      UPEX_TEST_EMAIL: ${{ secrets.UPEX_TEST_EMAIL }}
      UPEX_TEST_PASSWORD: ${{ secrets.UPEX_TEST_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run UI tests
        run: npx playwright test tests/ui --workers=1

      - name: Run API tests
        run: npx playwright test --config=playwright.api.config.ts --workers=1

      - name: Upload UI test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload API test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api-report
          path: playwright-report-api/
          if-no-files-found: ignore
          retention-days: 30
